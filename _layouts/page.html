---
layout: default
---
{% if page.hero_image %}
  <section class="hero hero--page" style="background-image:url('{{ page.hero_image }}');">
    <div class="hero-inner">
      <h1>{{ page.hero_title | default: page.title }}</h1>
    </div>
  </section>
{% else %}
  <section class="page-band">
    <h1>{{ page.title }}</h1>
    <div class="rule"></div>
  </section>
{% endif %}
<div class="content">
  {{ content }}
</div>
